<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Analytics</title>
<!-- Bundled with the app. Shows the user's own games, sent in by the app via window.LApp.render(). No network access. -->
<style>
:root{--bg:#101115;--text:#F5EFE3;--text2:#D8D0C1;--muted:#A39C8F;--gold:#E6C27A;--goldHi:#F6DE9E;--coral:#E59A80;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.07);
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.35,.5,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(120% 50% at 50% -10%,#2A2116 0%,var(--bg) 55%) no-repeat,var(--bg)}
#root{max-width:1100px;margin:0 auto;padding:var(--top,16px) 20px var(--bottom,24px);display:flex;flex-direction:column;gap:16px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:800}to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.rise{animation:rise .6s var(--ease) both}.settled .rise{animation:none}.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:4px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#C9A866}
h1{margin:4px 0 0;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.025em}
h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.small{font-size:13px;color:var(--muted)} .note{margin:0;font-size:13px;color:#B9B1A2}
.card{padding:18px;border-radius:24px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.card.gold{background:linear-gradient(180deg,rgba(230,194,122,.09),rgba(255,255,255,.03));border-color:rgba(230,194,122,.24)}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:12px;background:rgba(255,255,255,.06)}
.seg button{position:relative;z-index:1;height:30px;padding:0 12px;border:0;background:transparent;color:#B9B1A2;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;transition:color .25s}
.seg button[aria-selected="true"]{color:#1A1309}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--gold);transition:transform .45s var(--spring)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.kpi b{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.grid{display:flex;flex-direction:column;gap:16px}
.bars{position:relative;height:180px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;padding-top:24px;border-bottom:1px solid rgba(255,255,255,.12)}
.bars .gl{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.07)}
.bars button{position:relative;height:100%;border:0;padding:0;background:transparent;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font:inherit}
.bar{display:block;width:100%;max-width:32px;min-height:4px;border-radius:8px 8px 3px 3px;background:rgba(230,194,122,.32);transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,1.2,.4,1) both}
.bar.best{background:rgba(230,194,122,.75)} .bar.on{background:linear-gradient(180deg,var(--goldHi),#C8913A)}
.tip{position:absolute;top:-22px;left:50%;transform:translateX(-50%);padding:2px 7px;border-radius:8px;background:var(--text);color:#15130F;font-size:12px;font-weight:700;white-space:nowrap;animation:pop .35s var(--spring) both}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;text-align:center;font-size:12px;color:var(--muted)}
.line{position:relative;height:140px}
.line svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.line .path{stroke-dasharray:800;animation:draw 1.4s cubic-bezier(.4,0,.2,1) .2s both}
.dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:5px;background:var(--gold);box-shadow:0 0 0 2px #1A1A1E;animation:pop .4s var(--spring) both}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card);border:1px solid rgba(255,255,255,.06)}
.row .grow{flex:1;min-width:0}.row .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;height:26px;padding:0 10px;border-radius:13px;display:flex;align-items:center;font-size:12px;font-weight:600}
.ok{background:rgba(230,194,122,.14);color:var(--gold)}.bad{background:rgba(201,120,90,.16);color:var(--coral)}
.btn{height:46px;border-radius:15px;border:0;font:inherit;font-size:15px;font-weight:600;padding:0 18px;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.gold{background:linear-gradient(180deg,#F1D48E,#D9A851 55%,#B8843A);color:#1A1309}
.btn.ghost{background:rgba(230,194,122,.08);border:1px solid rgba(230,194,122,.45);color:var(--gold);height:36px;font-size:14px;padding:0 14px}
.empty{align-items:center;text-align:center;padding:28px 20px}
.empty .ic{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:rgba(230,194,122,.12)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(230,194,122,.08);border:1px solid rgba(230,194,122,.25);font-size:13px;color:var(--text2)}
@media (min-width:768px){
  #root{padding-left:40px;padding-right:40px}
  h1{font-size:40px;letter-spacing:-.03em}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kpi{padding:18px}.kpi b{font-size:32px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
  .recent{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
}
.recent{display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="root" aria-live="polite"></main>
<script>
(function () {
  'use strict';
  var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var FULL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  var S = { period: 'month', metric: 'signups', sel: -1, data: { games: [], hasSample: false }, first: true };
  var root = document.getElementById('root');
  var lastKey = '';

  function send(msg) { try { window.LNative.postMessage(msg); } catch (e) { /* running outside the app */ } }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function dow(d) { return (d.getDay() + 6) % 7; } // Monday = 0
  function seg(key, opts) {
    var i = opts.map(function (o) { return o[0]; }).indexOf(S[key]);
    return '<div class="seg" role="tablist"><span class="thumb" style="width:calc((100% - 6px)/' + opts.length + ');transform:translateX(' + (i * 100) + '%)"></span>' +
      opts.map(function (o) { return '<button role="tab" aria-selected="' + (S[key] === o[0]) + '" data-k="' + key + '" data-v="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>';
  }

  function render() {
    var now = Date.now();
    var span = S.period === 'week' ? 7 : S.period === 'month' ? 30 : 100000;
    var games = S.data.games.filter(function (g) { return g.success !== null && g.success !== undefined; })
      .map(function (g) { return Object.assign({}, g, { d: new Date(g.date) }); })
      .filter(function (g) { return (now - g.d.getTime()) / 864e5 <= span; })
      .sort(function (a, b) { return b.d - a.d; });

    var head = '<header class="head rise"><div><span class="eyebrow">From your games</span><h1>Analytics</h1></div>' +
      seg('period', [['week', 'Week'], ['month', 'Month'], ['all', 'All']]) + '</header>';

    var banner = S.data.hasSample
      ? '<div class="banner rise d1"><span>Includes sample games so you can see how the charts work.</span><button class="btn ghost" data-act="removeSample">Remove</button></div>' : '';

    if (!games.length) {
      root.innerHTML = head + banner +
        '<section class="card gold empty rise d1"><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E6C27A" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg></div>' +
        '<h2>No results yet</h2><p class="note" style="max-width:340px">Save a game in “Your game”, play it, then tap it to record who came and how it went. Your stats will appear here.</p>' +
        (S.data.hasSample ? '' : '<button class="btn gold" data-act="addSample">Show sample games</button>') + '</section>';
      return;
    }

    var signups = [0, 0, 0, 0, 0, 0, 0], ok = [0, 0, 0, 0, 0, 0, 0], cnt = [0, 0, 0, 0, 0, 0, 0], rsum = [0, 0, 0, 0, 0, 0, 0], rcnt = [0, 0, 0, 0, 0, 0, 0];
    var total = 0, okAll = 0, rAll = 0, rN = 0;
    games.forEach(function (g) {
      var i = dow(g.d);
      cnt[i]++; total += g.signups || 0;
      if (g.success) { signups[i] += g.signups || 0; ok[i]++; okAll++; } else { signups[i] += g.signups || 0; }
      if (g.rating) { rsum[i] += g.rating; rcnt[i]++; rAll += g.rating; rN++; }
    });
    var successPct = cnt.map(function (c, i) { return c ? Math.round(ok[i] / c * 100) : 0; });
    var vals = S.metric === 'signups' ? signups : successPct;
    var max = Math.max.apply(null, vals.concat([S.metric === 'signups' ? 1 : 100]));
    var best = vals.indexOf(Math.max.apply(null, vals));

    var kpis = [['Signed up', total, 'people across ' + games.length + ' games'], ['Games played', games.length, okAll + ' successful'],
      ['Successful', Math.round(okAll / games.length * 100) + '%', 'happened as planned'], ['Avg rating', rN ? (rAll / rN).toFixed(1) : '—', 'out of 5']];

    var bars = vals.map(function (v, i) {
      var h = Math.max(4, Math.round(v / max * 150));
      var label = S.metric === 'signups' ? v + ' people' : (cnt[i] ? v + '%' : 'no games');
      return '<button data-bar="' + i + '" aria-label="' + FULL[i] + ': ' + label + '">' + (S.sel === i ? '<span class="tip">' + label + '</span>' : '') +
        '<span class="bar' + (S.sel === i ? ' on' : (i === best && v > 0 ? ' best' : '')) + '" style="height:' + h + 'px;animation-delay:' + (S.first ? 0.05 * i : 0) + 's"></span></button>';
    }).join('');

    var avg = rsum.map(function (s, i) { return rcnt[i] ? s / rcnt[i] : null; });
    var pts = [];
    avg.forEach(function (r, i) { if (r !== null) pts.push([(i + 0.5) / 7 * 100, 100 - ((r - 1) / 4) * 86 - 7, r, i]); });
    var poly = pts.map(function (p) { return p[0].toFixed(2) + ',' + p[1].toFixed(2); }).join(' ');
    var bestDay = -1, bestR = 0; avg.forEach(function (r, i) { if (r !== null && r > bestR) { bestR = r; bestDay = i; } });
    var line = '<div class="line"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6C27A" stop-opacity=".28"/><stop offset="1" stop-color="#E6C27A" stop-opacity="0"/></linearGradient></defs>' +
      (pts.length > 1 ? '<polygon points="' + poly + ' ' + pts[pts.length - 1][0].toFixed(2) + ',100 ' + pts[0][0].toFixed(2) + ',100" fill="url(#lg)"/><polyline class="path" points="' + poly + '" fill="none" stroke="#E6C27A" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' : '') +
      '</svg>' + pts.map(function (p) { return '<span class="dot" title="' + FULL[p[3]] + ': ' + p[2].toFixed(1) + ' ★" style="left:' + p[0] + '%;top:' + p[1] + '%' + (p[3] === bestDay ? ';background:var(--goldHi)' : '') + '"></span>'; }).join('') + '</div>';

    root.innerHTML = head + banner +
      '<div class="kpis rise d1">' + kpis.map(function (k) { return '<div class="kpi"><span class="small">' + k[0] + '</span><b>' + k[1] + '</b><span class="small" style="color:#D9B36A;font-weight:600;font-size:12px">' + k[2] + '</span></div>'; }).join('') + '</div>' +
      '<div class="grid">' +
      '<section class="card rise d2"><div class="between"><h2>By day of week</h2>' + seg('metric', [['signups', 'Sign-ups'], ['success', 'Success']]) + '</div>' +
      '<p class="note">' + (S.metric === 'signups' ? 'How many people signed up, by weekday. Tap a bar.' : 'Share of games that happened as planned, by weekday.') + '</p>' +
      '<div class="bars"><span class="gl" style="top:24px"></span><span class="gl" style="top:99px"></span>' + bars + '</div><div class="days">' + DAYS.map(function (d) { return '<span>' + d + '</span>'; }).join('') + '</div></section>' +
      '<section class="card rise d3"><div class="between"><h2>Average game rating</h2><span class="small">out of 5</span></div>' +
      '<p class="note">' + (bestDay >= 0 ? 'Best day: ' + FULL[bestDay] + ' (' + bestR.toFixed(1) + ' ★).' : 'Rate your games to see this chart.') + '</p>' + line +
      '<div class="days">' + DAYS.map(function (d) { return '<span>' + d + '</span>'; }).join('') + '</div></section></div>' +
      '<section class="rise d4" style="display:flex;flex-direction:column;gap:10px"><h2 style="font-size:22px;font-weight:700">Recent games</h2><div class="recent">' +
      games.slice(0, 6).map(function (g) {
        return '<article class="row"><div class="grow"><div class="t">' + esc(g.name) + '</div><div class="small">' + DAYS[dow(g.d)] + ' · ' + (g.signups || 0) + ' players' + (g.rating ? ' · ' + g.rating.toFixed(1) + ' ★' : '') + '</div></div>' +
          '<span class="badge ' + (g.success ? 'ok">✓ Played' : 'bad">✕ Didn’t happen') + '</span></article>';
      }).join('') + '</div></section>';
    S.first = false;
    setTimeout(function () { root.classList.add('settled'); }, 900);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-k],[data-bar],[data-act]');
    if (!t) return;
    if (t.dataset.k) { S[t.dataset.k] = t.dataset.v; S.sel = -1; }
    else if (t.dataset.bar) { var i = +t.dataset.bar; S.sel = S.sel === i ? -1 : i; }
    else if (t.dataset.act) { send(t.dataset.act); return; }
    render();
  });

  window.LApp = {
    render: function (data, insets) {
      var key = JSON.stringify(data) + JSON.stringify(insets || {});
      if (key === lastKey) return;
      lastKey = key;
      S.data = data || { games: [] };
      if (insets) {
        document.documentElement.style.setProperty('--top', (insets.top + (insets.wide ? 36 : 16)) + 'px');
        document.documentElement.style.setProperty('--bottom', (insets.bottom + 24) + 'px');
      }
      render();
    }
  };
  render();
  send('ready');
})();
</script>
</body>
</html>
